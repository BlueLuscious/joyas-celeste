{% extends "base.html" %}
{% load static %}
{% load filters.product_filter %}

{% block content %}
<section class="w-full min-h-screen pt-32 md:pt-36">
    <div class="flex-1 flex flex-col size-full">

        <!-- Label -->
        <div class="w-full p-6 bg-primary-earth_tone_4 text-center">
            <span class="text-2xl sm:text-4xl text-primary-earth_tone_3 cinzel-semibold">
                Metodos de pago
            </span>
        </div>
    
        <!-- Payment Methods -->
        <div class="flex flex-col md:flex-row justify-center md:justify-start gap-y-6 md:gap-x-12 w-full 
            py-8 px-4 md:p-12"
        >
            <div class="w-full max-w-lg md:max-w-3xl p-4 md:px-8 bg-white rounded-sm shadow-md">
                <div class="py-2 md:py-4 border-b-2 border-primary-earth_tone_4/70 text-lg md:text-xl 
                    text-primary-earth_tone_4 font-medium mukta-light"
                >Mercado Pago</div>
                <div class="box-content" id="payment_button"></div>
            </div>

            <div class="w-full h-fit max-w-lg md:max-w-3xl p-4 md:p-8 ring-2 ring-primary-earth_tone_4 rounded-md">
                <div class="text-base/7 md:text-lg text-justify text-primary-earth_tone_4 font-medium mukta-light">
                    NOTA: Al presionar el boton de "Pagar con Mercado Pago" 
                    vas a poder pagar con el mismo o con cualquier tipo de 
                    tarjeta de debito o credito.
                </div>
            </div>
        </div>

    </div>
</section>

<script>
    const mp = new MercadoPago("{{ public_key }}", { locale: "es-AR" })
    const bricksBuilder = mp.bricks()

    bricksBuilder.create("wallet", "payment_button", {
        initialization: {
            preferenceId: "{{ preference.id }}",
            redirectMode: "blank"
        },
        // # TODO: Set in Prod.
        // callbacks: {
        //     onReady: () => {},
        //     onSubmit: () => {},
        //     onError: (error) => console.error(error),
        // },
        customization: {
            checkout: {
                theme: {
                    elementsColor: "#8C694B",
                    headerColor: "#8C694B",
                },
            },
            texts: {
                action: "pay",
                valueProp: 'smart_option',
            },
            visual: {
                buttonBackground: "default",
                valuePropColor: "grey",
            },
        },
    })
</script>
{% endblock content %}
