<div class="relative">
    <!-- Open Search Bar Button -->
    <button type="button" id="open_search_bar" onclick="toggleElementTranslateById('search_bar', 'translate-x-full')" 
        class="z-10 fixed top-28 right-0 h-14 p-2 bg-white text-primary-earth_tone_4 font-semibold 
        rounded-l-lg shadow-lg focus:outline-none"
    >
        {% include "icons/magnifying-glass.html" with tailwind_class="size-6" %}
    </button>

    <!-- Search Bar -->
    <div id="search_bar" class="z-20 fixed top-28 right-0 w-full max-w-md h-14 p-2 bg-white 
        rounded-l-lg shadow-lg transform translate-x-full transition-transform duration-300 ease-in-out"
    >
        <div class="flex flex-row gap-x-2 items-center">
            <!-- Search Button -->
            <button type="button" id="search_button" class="text-primary-earth_tone_4 focus:outline-none">
                {% include "icons/magnifying-glass.html" with tailwind_class="size-6" %}
            </button>
            <div class="w-full">
                <input type="text" id="search_text" placeholder="Buscar..." 
                    unicorn:model.defer="selected_search_text" unicorn:change="update_products" 
                    class="w-full p-2 border border-gray-300 rounded-md focus:outline-primary-earth_tone_4"
                >
            </div>
            <!-- Close Search Bar Button -->
            <button type="button" id="close_search_bar" onclick="toggleElementTranslateById('search_bar', 'translate-x-full')" 
                class="text-primary-earth_tone_4 rounded-md focus:outline-none"
            >
                {% include "icons/x-mark.html" with tailwind_class="size-7 transition-transform duration-300 ease-in-out hover:-rotate-90" %}
            </button>
        </div>
    </div>
</div>
