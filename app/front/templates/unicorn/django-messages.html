{% load unicorn %}

<div id="django_messages">
    {% if messages_list %}
    <div class="fixed {{ tailwind_class }} flex flex-col items-center md:items-start gap-y-4 
        w-full max-w-lg px-4 md:px-0"
    >
        {% for message in messages_list %}
        <div class="w-full p-3 text-lg md:text-xl text-white text-center rounded-sm 
            md:rounded-md mukta-light opacity-100 transition-all duration-500 ease-in-out
            {% if message.level_tag == 'success' %} bg-green-600
            {% elif message.level_tag == 'error' %} bg-red-600
            {% elif message.level_tag == 'info' %} bg-blue-600
            {% endif %}"
        >{{ message.text }}</div>
        {% endfor %}
    </div>
    {% endif %}
</div>
